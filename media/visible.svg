<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0b0f14"/>
  <text x="80" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" fill="#c9d4e0" font-weight="bold">Nearly half of what review finds late was already on the page in round one.</text>
  <text x="80" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8899aa">Share of round 2+ findings on a line unchanged since round one · 1,301 PRs, 1,320 late findings, 180 days, no model runs</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">
    <text x="110" y="245" fill="#c9d4e0">withastro/astro</text><rect x="470" y="215" width="491" height="40" rx="6" fill="#2e7d5b"/><text x="976" y="245" fill="#7fd1a8" font-weight="bold">54.6%</text>
    <text x="110" y="315" fill="#c9d4e0">sveltejs/kit</text><rect x="470" y="285" width="500" height="40" rx="6" fill="#2e7d5b"/><text x="985" y="315" fill="#7fd1a8" font-weight="bold">55.6%</text>
    <text x="110" y="385" fill="#c9d4e0">TanStack/query</text><rect x="470" y="355" width="535" height="40" rx="6" fill="#2e7d5b"/><text x="1020" y="385" fill="#7fd1a8" font-weight="bold">59.4%</text>
    <text x="110" y="455" fill="#c9d4e0">vitest-dev/vitest</text><rect x="470" y="425" width="405" height="40" rx="6" fill="#2e7d5b"/><text x="890" y="455" fill="#7fd1a8" font-weight="bold">45.0%</text>
    <text x="110" y="525" fill="#c9d4e0">colinhacks/zod (all bot reviews)</text><rect x="470" y="495" width="123" height="40" rx="6" fill="#5b6b7c"/><text x="608" y="525" fill="#c9d4e0" font-weight="bold">13.7%</text>
    <text x="110" y="615" fill="#c9d4e0">Pooled, five repos</text><rect x="470" y="585" width="417" height="40" rx="6" fill="#ffd166"/><text x="902" y="615" fill="#ffd166" font-weight="bold">46.3%</text>
  </g>
  <text x="110" y="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8899aa">Humans 55.0% · bots 27.3%. Where a finding is anchored, not whether the reviewer should have caught it.</text>
  <text x="80" y="850" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#6b7a8c">github.com/codegobrrrr9/tollgate · definitions fixed before the data was read · benchmarks/results.md</text>
</svg>
